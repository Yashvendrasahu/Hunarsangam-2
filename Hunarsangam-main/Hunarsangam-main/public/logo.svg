<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="50%" stop-color="#0D47A1" />
      <stop offset="100%" stop-color="#0A2472" />
    </linearGradient>

    <linearGradient id="ribbonSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081" />
      <stop offset="30%" stop-color="#9C27B0" />
      <stop offset="65%" stop-color="#673AB7" />
      <stop offset="85%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>

    <linearGradient id="flameBrushGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D50000" />
      <stop offset="40%" stop-color="#FF3D00" />
      <stop offset="75%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FFEA00" />
    </linearGradient>

    <linearGradient id="ribbonLower" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="45%" stop-color="#9C27B0" />
      <stop offset="75%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>

    <linearGradient id="spoolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A237E" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>

    <linearGradient id="potteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97746" />
      <stop offset="50%" stop-color="#B85324" />
      <stop offset="100%" stop-color="#7C3210" />
    </linearGradient>

    <radialGradient id="paletteGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#283593" />
      <stop offset="70%" stop-color="#1A237E" />
      <stop offset="100%" stop-color="#0D1B48" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background is transparent -->
  <g filter="url(#softShadow)">
    <!-- SWOOSHING ACCENT RIBBONS (BACKGROUND) -->
    <path d="M 120 420 C 50 360 40 240 80 160 C 120 80 260 50 360 90 C 430 118 480 200 460 300 C 440 400 340 470 230 465 C 160 460 90 420 120 420 Z" 
          fill="none" stroke="url(#ribbonLower)" stroke-width="7" stroke-linecap="round" opacity="0.95" />

    <!-- TOP-LEFT: PAINTBRUSH WITH FLAME BRISTLES -->
    <path d="M 112 110 L 140 230 L 152 226 L 126 106 Z" fill="#1A237E" />
    <polygon points="110,105 128,100 132,112 114,117" fill="#CFD8DC" />
    <path d="M 110 105 C 100 80 90 60 120 20 C 135 50 148 70 128 100 C 125 105 115 108 110 105 Z" fill="url(#flameBrushGrad)" />
    <path d="M 114 85 C 110 65 112 45 122 30 C 128 50 130 65 124 85 Z" fill="#FFF9C4" opacity="0.8" />

    <!-- LEFT MONOGRAM "H" (Serif Cobalt Blue) -->
    <path d="M 130 140 L 195 140 L 180 165 L 180 410 L 130 410 L 130 425 L 230 425 L 230 410 L 198 410 L 198 165 L 210 140 Z" fill="url(#blueHGrad)" />
    <rect x="180" y="275" width="105" height="28" fill="url(#blueHGrad)" rx="3" />
    <path d="M 125 145 C 145 145 155 140 160 135 L 225 135 L 215 155 Z" fill="url(#blueHGrad)" />

    <!-- MONOGRAM "S" & FLOWING ART RIBBONS -->
    <path d="M 260 135 C 330 120 420 150 430 230 C 440 310 320 330 250 360 C 190 385 110 430 150 460 C 200 495 360 485 430 420 C 455 395 480 340 470 270 C 480 340 435 440 340 470 C 230 500 130 470 100 420 C 70 370 110 330 180 290 C 250 250 370 230 360 180 C 350 140 290 140 260 135 Z" 
          fill="url(#ribbonSGrad)" />

    <!-- TOP-RIGHT: SEWING SPOOL & NEEDLE -->
    <g transform="translate(370, 130) rotate(25)">
      <path d="M -15 -60 L -12 -58 L 25 70 L 22 70 Z" fill="#B0BEC5" />
      <circle cx="-13" cy="-55" r="1.5" fill="#37474F" />
      <ellipse cx="20" cy="-20" rx="20" ry="8" fill="#1A237E" />
      <ellipse cx="20" cy="30" rx="20" ry="8" fill="#1A237E" />
      <rect x="0" y="-20" width="40" height="50" fill="#0D47A1" />
      <rect x="2" y="-12" width="36" height="34" rx="4" fill="#E91E63" />
      <line x1="2" y1="-6" x2="38" y2="-6" stroke="#C2185B" stroke-width="2" />
      <line x1="2" y1="0" x2="38" y2="0" stroke="#FF4081" stroke-width="2" />
      <line x1="2" y1="6" x2="38" y2="6" stroke="#C2185B" stroke-width="2" />
      <line x1="2" y1="12" x2="38" y2="12" stroke="#FF4081" stroke-width="2" />
      <path d="M 38 10 C 60 15 75 40 60 65 C 50 80 70 110 90 95" fill="none" stroke="#E91E63" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- LEFT: ARTIST PALETTE WITH VIBRANT COLOR BLOBS -->
    <g transform="translate(40, 220)">
      <path d="M 60 10 C 110 5 130 50 110 95 C 95 130 65 140 35 125 C 10 110 5 70 20 40 C 30 20 45 12 60 10 Z" fill="url(#paletteGrad)" />
      <ellipse cx="75" cy="100" rx="10" ry="14" fill="#FFFFFF" />
      <circle cx="45" cy="35" r="9" fill="#FF4081" />
      <circle cx="75" cy="30" r="9" fill="#FFC107" />
      <circle cx="95" cy="55" r="9" fill="#00E676" />
      <circle cx="50" cy="70" r="9" fill="#00E5FF" />
      <circle cx="15" cy="110" r="4" fill="#FF5722" />
      <circle cx="3" cy="85" r="3" fill="#E91E63" />
    </g>

    <!-- FLORAL & LEAF FLOURISHES -->
    <g transform="translate(420, 280)">
      <path d="M 0 0 C 25 -30 50 -10 30 20 C 15 30 0 15 0 0 Z" fill="#00C853" />
      <path d="M 20 -15 C 45 -40 65 -25 45 -5 C 35 5 20 -5 20 -15 Z" fill="#00B0FF" />
      <path d="M 15 25 C 40 20 50 45 30 55 C 15 60 10 40 15 25 Z" fill="#9C27B0" />
      <path d="M 25 50 C 45 60 40 85 20 80 C 10 75 15 60 25 50 Z" fill="#E91E63" />
    </g>
    <g transform="translate(190, 420)">
      <path d="M 0 0 C -20 -15 -35 5 -15 20 C 0 25 5 10 0 0 Z" fill="#00C853" />
      <path d="M 15 5 C 30 0 40 18 25 25 C 15 28 8 18 15 5 Z" fill="#7C4DFF" />
    </g>

    <!-- LOWER CENTER: MASTER ARTISAN & TERRACOTTA POTTERY -->
    <g transform="translate(250, 270)">
      <ellipse cx="90" cy="40" rx="18" ry="22" fill="#3E2723" />
      <ellipse cx="90" cy="44" rx="14" ry="16" fill="#8D5B4C" />
      <path d="M 78 45 C 80 62 100 62 102 45 C 98 56 82 56 78 45 Z" fill="#212121" />
      <path d="M 82 43 Q 90 48 98 43" stroke="#212121" stroke-width="2.5" fill="none" />
      <path d="M 82 36 Q 87 34 91 37" stroke="#212121" stroke-width="1.8" fill="none" />
      <path d="M 68 62 L 112 62 L 125 125 L 55 125 Z" fill="#212121" />
      <path d="M 74 65 L 106 65 L 115 130 L 65 130 Z" fill="#795548" />
      <line x1="78" y1="65" x2="84" y2="90" stroke="#4E342E" stroke-width="2.5" />
      <line x1="102" y1="65" x2="96" y2="90" stroke="#4E342E" stroke-width="2.5" />

      <path d="M 60 70 C 45 90 55 120 75 110" stroke="#8D5B4C" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M 120 70 C 130 95 105 108 90 102" stroke="#8D5B4C" stroke-width="9" stroke-linecap="round" fill="none" />
      <line x1="105" y1="92" x2="80" y2="108" stroke="#3E2723" stroke-width="2" />
      <circle cx="79" cy="109" r="1.5" fill="#FFFFFF" />

      <path d="M 40 125 C 30 145 70 155 90 150 C 110 155 150 145 140 125 C 120 120 60 120 40 125 Z" fill="#1A237E" />

      <g transform="translate(80, 100)">
        <ellipse cx="0" cy="15" rx="18" ry="16" fill="url(#potteryGrad)" />
        <ellipse cx="0" cy="1" rx="8" ry="3" fill="#D7CCC8" />
        <ellipse cx="0" cy="2" rx="6" ry="2" fill="#5D4037" />
        <circle cx="0" cy="15" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 1.5" />
        <path d="M -9 15 Q 0 8 9 15 Q 0 22 -9 15" fill="none" stroke="#FFFFFF" stroke-width="1" />
      </g>
    </g>

    <!-- SURROUNDING POTTERY & PIGMENT BOTTLES -->
    <g transform="translate(225, 370)">
      <line x1="0" y1="10" x2="-8" y2="-20" stroke="#5D4037" stroke-width="2.5" />
      <polygon points="-9,-20 -6,-25 -11,-24" fill="#FF5722" />
      <line x1="5" y1="10" x2="3" y2="-25" stroke="#4E342E" stroke-width="2.5" />
      <polygon points="3,-25 6,-30 1,-29" fill="#00E5FF" />
      <ellipse cx="0" cy="22" rx="16" ry="18" fill="url(#potteryGrad)" />
      <rect x="-6" y="2" width="12" height="6" fill="#8D4018" rx="2" />
      <ellipse cx="0" cy="2" rx="6" ry="2" fill="#5D4037" />
      <path d="M -12 22 Q 0 15 12 22 Q 0 29 -12 22" fill="none" stroke="#FFF" stroke-width="1" />
    </g>

    <g transform="translate(385, 385)">
      <ellipse cx="0" cy="15" rx="22" ry="16" fill="url(#potteryGrad)" />
      <ellipse cx="0" cy="0" rx="12" ry="4" fill="#A04018" />
      <ellipse cx="0" cy="1" rx="9" ry="2.5" fill="#4E342E" />
      <circle cx="0" cy="15" r="14" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 2" />
      <path d="M -15 15 L 15 15" stroke="#FFFFFF" stroke-width="0.8" />
    </g>

    <g transform="translate(310, 415)">
      <rect x="0" y="0" width="12" height="15" rx="3" fill="#E91E63" />
      <rect x="-1" y="-2" width="14" height="4" rx="1.5" fill="#C2185B" />
      <rect x="15" y="0" width="12" height="15" rx="3" fill="#673AB7" />
      <rect x="14" y="-2" width="14" height="4" rx="1.5" fill="#512DA8" />
      <rect x="30" y="0" width="12" height="15" rx="3" fill="#FFC107" />
      <rect x="29" y="-2" width="14" height="4" rx="1.5" fill="#FFA000" />
      <rect x="45" y="0" width="12" height="15" rx="3" fill="#00BCD4" />
      <rect x="44" y="-2" width="14" height="4" rx="1.5" fill="#0097A7" />
    </g>
  </g>
</svg>
